defaults:
  imgsz: 640
  epochs: 30
  seed: 0
  close_mosaic: 5
  patience: 100
  workers: 4
  amp: true
  cache: false

datasets:
  llvip:
    imgsz: 640
    train_stride: 3
    val_stride: 1
  m3fd:
    imgsz: 640
    val_frac: 0.2
    seed: 0

runs:
  - {name: llvip_yolo26n_visible, notebook: "04", data: llvip/data_visible.yaml,  model: yolo26n.yaml, batch: 32}
  - {name: llvip_yolo26n_thermal, notebook: "04", data: llvip/data_infrared.yaml, model: yolo26n.yaml, batch: 32}

  - {name: llvip_concat, notebook: "05", data: llvip/data_paired.yaml, model: configs/models/two-stream-concat-n.yaml, batch: 16}
  - {name: m3fd_concat,  notebook: "05", data: m3fd/data_paired.yaml,  model: configs/models/two-stream-concat-n.yaml, batch: 16}

  - {name: llvip_cffm, notebook: "07", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n.yaml, batch: 16}
  - {name: m3fd_cffm,  notebook: "07", data: m3fd/data_paired.yaml,  model: configs/models/cffm-net-n.yaml, batch: 16}

  - {name: llvip_cffm_nogate, notebook: "08", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-nogate.yaml, batch: 16}
  - {name: llvip_cffm_gconv,  notebook: "08", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-gconv.yaml,  batch: 16}
  - {name: llvip_cffm_nop2,   notebook: "08", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-nop2.yaml,   batch: 16, optional: true}

  - {name: llvip_concat_p2,   notebook: "08b", data: llvip/data_paired.yaml, model: configs/models/two-stream-concat-p2-n.yaml, batch: 16}
  - {name: llvip_cffm_nop2b,  notebook: "08b", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-nop2.yaml,      batch: 16}

  - {name: llvip_cffm_v2,   notebook: "08c", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-v2.yaml,         batch: 16}
  - {name: llvip_concat_md, notebook: "08c", data: llvip/data_paired.yaml, model: configs/models/two-stream-concat-n-md.yaml, batch: 16}
  - {name: m3fd_cffm_v2,    notebook: "08d", data: m3fd/data_paired.yaml,  model: configs/models/cffm-net-n-v2.yaml,         batch: 16}
  - {name: m3fd_concat_md,  notebook: "08d", data: m3fd/data_paired.yaml,  model: configs/models/two-stream-concat-n-md.yaml, batch: 16}

  - {name: llvip_cffm_v2_e80,   notebook: "08e", data: llvip/data_paired.yaml, model: configs/models/cffm-net-n-v2.yaml,         batch: 16, epochs: 80, close_mosaic: 10}
  - {name: llvip_concat_md_e80, notebook: "08e", data: llvip/data_paired.yaml, model: configs/models/two-stream-concat-n-md.yaml, batch: 16, epochs: 80, close_mosaic: 10}
  - {name: m3fd_cffm_v2_e80,    notebook: "08f", data: m3fd/data_paired.yaml,  model: configs/models/cffm-net-n-v2.yaml,         batch: 16, epochs: 80, close_mosaic: 10}
  - {name: m3fd_concat_md_e80,  notebook: "08f", data: m3fd/data_paired.yaml,  model: configs/models/two-stream-concat-n-md.yaml, batch: 16, epochs: 80, close_mosaic: 10}

probe:
  runs: [llvip_cffm, llvip_cffm_nogate, llvip_concat]
  kinds: [clean, visible_dark, visible_drop, thermal_drop, thermal_shift_4, thermal_shift_8, thermal_shift_16]
  flagged: [visible_drop, thermal_drop]
